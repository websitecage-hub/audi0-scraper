name: keepalive

# Render's free plan spins a web service down after ~15 minutes with no traffic,
# and a spinning-down service loses its in-memory cache. A self-ping cannot fix
# that (a sleeping service cannot wake itself), so the ping has to come from
# outside.
#
# NOTE: GitHub disables scheduled workflows after ~60 days of repository
# inactivity. If you need this to run indefinitely, either keep the repo active
# or use an external monitor (UptimeRobot, cron-job.org) against /v1/health.
#
# Set the target URL in repo Settings -> Secrets and variables -> Actions ->
# Variables as SERVICE_URL, e.g. https://tiktok-trending-api.onrender.com
# (https, no trailing slash).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /v1/health
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_URL:-}" ]; then
            echo "SERVICE_URL variable is not set; skipping."
            exit 0
          fi
          url="${SERVICE_URL%/}/v1/health"
          echo "GET $url"
          # A cold free-tier instance can take ~30s to boot.
          body=$(curl -sS --max-time 90 --retry 2 --retry-delay 15 --retry-all-errors "$url")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' \
            || { echo "::error::health check did not report status ok"; exit 1; }
