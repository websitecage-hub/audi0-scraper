# Render Blueprint — deploys the API as a Docker web service with a persistent disk.
# Push the repo (GitHub/GitLab), then either:
#   - connect the repo in the Render dashboard (Blueprint -> New Blueprint), or
#   - use the Render API: POST /v1/services with this file's values (see README).
#
# Note: Render persistent disks are only included on paid plans. On the free plan,
# remove the `disk:` block below — the service still runs, but /data won't persist
# between deploys/restarts.

services:
  - type: web
    name: trending-audio-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TL_LIBRARY
        value: /data
      - key: PORT
        value: 8000
      # Cap sits well under the 1GB disk: the container image, ffmpeg work files
      # and a partial download all live on the same volume, so a 700MB cap could
      # still hit ENOSPC mid-write and kill the service.
      - key: TL_MAX_LIBRARY_MB
        value: "600"
      # Refuse a new download when less than this is free.
      - key: TL_MIN_FREE_MB
        value: "80"
      - key: TL_MAX_CONCURRENT
        value: "2"
    disk:
      name: audio
      mountPath: /data
      sizeGB: 1
